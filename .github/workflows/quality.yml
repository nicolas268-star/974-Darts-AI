name: Qualité obligatoire

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend — qualité et sécurité
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json
      - run: npm ci
      - name: Tests frontend et fiches de tournois
        run: npm run test
      - name: Annuaire France et validation administrateur
        run: npm run test:france
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  backend:
    name: Backend — tests unitaires
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/backend/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install pytest==9.1.1
      - run: python -m compileall -q app
      - name: Tests backend, moteur tournoi et projections publiques
        run: python -m unittest discover -s tests -p "test_*.py"
      - run: python -m pytest -q tests/test_match_day.py tests/test_scoring_120_139.py

  ranking-workflow:
    name: Classement et tournois — intégrité transactionnelle
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests/workflow
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/workflow/package-lock.json
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/backend/requirements.txt
      - run: python -m pip install -r ../../app/backend/requirements.txt
      - name: Classement, fiches de tournois, reprise et permissions SQL
        run: npm test
      - name: Inventaire Comités France — preuves, isolation et RLS
        run: npm run test:france
      - name: Inscription joueurs — transaction, doublons, permissions et pages publiques
        run: npm run test:registration
      - run: npm ci --prefix ../../app/frontend
      - run: npx playwright install --with-deps chromium
      - name: Captain Nico — simulation et prévision avant match
        working-directory: app/frontend
        run: npm run test:captain:browser
        timeout-minutes: 8
      - name: Inscription joueurs — formulaire et pages sur mobile et ordinateur
        working-directory: app/frontend
        run: node scripts/test-player-registration-browser.mjs
        timeout-minutes: 8
      - run: npm run test:browser
        timeout-minutes: 20
      - run: npm run test:vision:browser
        timeout-minutes: 8
      - name: Générer les fixtures publiques T5 et OC1 hors ligne
        working-directory: app/backend
        run: python -m tests.build_tournament_ui_fixtures
      - name: Vérifier les fiches T5 et OC1 sur ordinateur, tablette et mobile
        working-directory: app/frontend
        run: npm run test:tournaments:browser
        timeout-minutes: 8
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ranking-workflow-preview
          path: |
            docs/ranking-workflow-preview/
            test-results/tournaments/
            /tmp/974darts-*.log
            /tmp/974darts-registration-qa/
          retention-days: 7

  containers:
    name: Conteneurs — architecture et images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Valider la syntaxe du déploiement des fiches
        run: bash -n deploy/deploy-tournament-pages.sh
      - name: Valider le déploiement Comités France
        run: bash -n deploy/deploy-france-inventory.sh
      - name: Préparer l'environnement Compose de CI
        run: |
          sudo install -d -m 755 /etc/974darts
          sudo touch /etc/974darts/production.env
          sudo touch /etc/974darts/ranking-preview.env
      - name: Valider la configuration Compose
        env:
          SITE_DOMAIN: example.test
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
        run: docker compose -f deploy/compose.yaml config --quiet
      - name: Vérifier le cache persistant partagé des fiches de tournois
        env:
          SITE_DOMAIN: example.test
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
        run: docker compose --profile ranking-workflow -f deploy/compose.yaml config --format json | python3 deploy/check-tournament-data-volume.py
      - name: Valider la configuration isolée du classement
        env:
          RANKING_PREVIEW_ENV_FILE: /etc/974darts/ranking-preview.env
          RANKING_PREVIEW_ORIGIN: https://preview-ds.example.test
          RANKING_PREVIEW_SUPABASE_URL: https://example.supabase.co
          RANKING_PREVIEW_SUPABASE_ANON_KEY: ci-placeholder
        run: docker compose -f deploy/compose.ranking-preview.yaml config --quiet
      - name: Construire l'image API sans navigateur
        run: docker build --target api -t darts974-api-ci app/backend
      - name: Vérifier la commande d'inventaire dans le conteneur API
        run: docker run --rm darts974-api-ci python -m app.scripts.france_inventory --help
      - name: Construire l'image worker légère
        run: docker build --target worker -t darts974-worker-ci app/backend
      - name: Construire l'image scraper avec Chromium
        run: docker build --target scraper -t darts974-scraper-ci app/backend
